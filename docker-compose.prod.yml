# Production overlay for one EC2 (or any VPS).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# TV / phone browser: http://<EC2_PUBLIC_IP>/
#
# Android: nested virt needs /dev/kvm + privileged + shm.
# ports: !override keeps only 6080 on the host (ADB stays internal).
# Compose !reset [] on android wiped 6080 entirely — prefer !override here.
# frontend/backend use ports: !reset [] so they are only reached via Caddy :80.

services:
  android:
    privileged: true
    shm_size: "2gb"
    devices:
      - /dev/kvm:/dev/kvm
    ports: !override
      - "6080:6080"
    environment:
      DEVICE: Samsung Galaxy S10
      EMULATOR_ADDITIONAL_ARGS: "-gpu swiftshader_indirect -no-metrics"
      EMULATOR_NO_SKIN: "true"
      APPIUM: "false"
      WEB_VNC: "true"
      WEB_LOG: "false"
      # Phone-shaped VNC; fill-emulator-window.sh maximizes Emulator to cover it.
      # noVNC resize=scale then scales this up to fill the browser viewport.
      SCREEN_WIDTH: "720"
      SCREEN_HEIGHT: "1280"

  backend:
    ports: !reset []
    environment:
      STREAM_URL: /novnc/vnc.html?autoconnect=1&resize=scale&reconnect=1&show_dot=0
      PUBLIC_STREAM_URL: /novnc/vnc.html?autoconnect=1&resize=scale&reconnect=1&show_dot=0
      ANDROID_HOST: android
      ANDROID_ADB_PORT: "5555"

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: umbrella-caddy
    depends_on:
      - frontend
      - backend
      - android
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
