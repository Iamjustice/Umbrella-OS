# Production overlay for one EC2 (or any VPS).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# TV / phone browser: http://<EC2_PUBLIC_IP>/
#
# Important: use ports: !reset [] so host ports from docker-compose.yml are NOT
# merged/double-bound (that caused "5554 address already in use").

services:
  android:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      STREAM_URL: /novnc/
      PUBLIC_STREAM_URL: /novnc/

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: umbrella-caddy
    depends_on:
      - frontend
      - backend
      - android
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
